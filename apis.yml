name: Zenaton
description: >-
  Zenaton was a workflow-as-code SaaS that let developers orchestrate background
  jobs, asynchronous tasks, and long-running business processes directly in
  application code (Node.js, Python, PHP, Ruby, Go) rather than wiring queues and
  cron by hand. Founded in France and backed by Accel and Point Nine, it processed
  10M+ workflow executions monthly across 100+ companies. The product is now
  DISCONTINUED: the API and app hosts (api.zenaton.com / app.zenaton.com) no longer
  resolve, the client SDK repositories are archived (last active ~2020), and the
  zenaton.com domain redirects to co-founder Gilles Barbier's personal site. This
  profile is retained as verified history — the archived first-party SDKs remain
  published on npm, PyPI, Packagist, RubyGems, and pkg.go.dev.
